spring:
  application:
    name: car-sharing-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/car_sharing_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:admin}
    password: ${SPRING_RABBITMQ_PASSWORD:123456}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
  servlet:
    multipart:
      # 上传照片用，默认只有 1MB，证件照很容易超
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  type-aliases-package: cn.ff26710.carsharingapp.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:car-sharing-app-2026-secret-key-32chars}
  expire-hours: ${JWT_EXPIRE_HOURS:2}

snowflake:
  worker-id: ${SNOWFLAKE_WORKER_ID:1}
  data-center-id: ${SNOWFLAKE_DATA_CENTER_ID:0}

wechat:
  enabled: ${WECHAT_ENABLED:false}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8080}
  upload:
    dir: ./uploads                        # 本地存储根目录
    url-prefix: /uploads                  # 对外访问前缀
    max-size: 5MB                         # 单文件上限，与 multipart 配置保持一致
    allowed-extensions: jpg,jpeg,png,webp,gif
  rental:
    free-mileage-per-day: 200        # 每天免费里程（km）
    exceed-mileage-fee: 1.50         # 超出部分单价（元/km）
    overtime-fee-per-hour: 30        # 超时单价（元/小时，不足一小时按一小时）
    overtime-max-charge-minutes: 240 # 单日超时最大时间（分钟，默认四小时）
    overtime-grace-minutes: 30       # 超时宽限（分钟，不收费）
    cancel-grace-minutes: 10         # 取消宽限（分钟，宽限内取消不扣费）
    expire-warn-hours: 6             # 到期前多少小时发「即将到期」提醒

logging:
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 15

# ---------------------------------------------------------------------------
#  Actuator：暴露健康检查与运行指标（探针 / 监控用）
#  - /actuator/health   健康检查，含 liveness / readiness 探针
#  - /actuator/info     应用信息
#  - /actuator/metrics  运行指标（JVM、HTTP、数据源等）
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true