spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

knife4j:
  enable: ${KNIFE4J_ENABLE:false}

snowflake:
  worker-id: ${SNOWFLAKE_WORKER_ID}
  data-center-id: ${SNOWFLAKE_DATA_CENTER_ID:0}

jwt:
  secret: ${JWT_SECRET}
  expire-hours: ${JWT_EXPIRE_HOURS:2}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8080}

logging:
  file:
    name: ${LOG_FILE:logs/system-log.log}
  level:
    root: WARN
    cn.ff26710.carsharingapp: INFO

wechat:
  enabled: ${WECHAT_ENABLED:false}
  pay:
    app-id: ${WECHAT_PAY_APP_ID:}
    merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
    merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    payment-notify-url: ${WECHAT_PAY_PAYMENT_NOTIFY_URL:}
    refund-notify-url: ${WECHAT_PAY_REFUND_NOTIFY_URL:}
  oauth:
    app-secret: ${WECHAT_OAUTH_SECRET:}

aliyun:
  enabled: ${ALIYUN_ENABLED:false}
  sms:
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    endpoint: dysmsapi.aliyuncs.com
    sign-name: CAR-SHARING-APP # 短信前缀签名
    template-code:
      send-code: SMS_xxx