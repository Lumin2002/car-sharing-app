spring:
  application:
    name: car-sharing-app
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/car_sharing_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: 123456
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
  servlet:
    multipart:
      # 上传照片用，默认只有 1MB，证件照很容易超
      max-file-size: 5MB
      max-request-size: 10MB

logging:
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 15
  file:
    name: logs/system-log.log

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: cn.ff26710.carsharingapp.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true

jwt:
  secret: car-sharing-app-2026-secret-key-32chars
  expire-hours: 2

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:8080
  upload:
    dir: ./uploads                        # 本地存储根目录
    url-prefix: /uploads                  # 对外访问前缀
    max-size: 5MB                         # 单文件上限，与 multipart 配置保持一致
    allowed-extensions: jpg,jpeg,png,webp,gif
  rental:
    free-mileage-per-day: 200       # 每天免费里程（km）
    exceed-mileage-fee: 1.50        # 超出部分单价（元/km）
    overtime-fee-per-hour: 30       # 超时单价（元/小时，不足一小时按一小时）
    overtime-grace-minutes: 30      # 超时宽限（分钟，不收费）
    cancel-grace-minutes: 10        # 取消宽限（分钟，宽限内取消不扣费）
    expire-warn-hours: 6            # 到期前多少小时发「即将到期」提醒
